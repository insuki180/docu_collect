<!DOCTYPE html>
<html>
<head>
<base target="_top">
<script src="config.js"></script>
<link id="appFavicon" rel="icon" type="image/png" href="assets/eassyonboard-logo.png">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style type="text/tailwindcss">
body { font-family: 'Inter', sans-serif; @apply m-0 min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(59,130,246,0.10),_transparent_22%),radial-gradient(circle_at_top_right,_rgba(14,165,233,0.08),_transparent_18%),#f8fafc] p-5 text-slate-800 md:p-8; }

.controls { @apply mb-8 flex flex-wrap items-center gap-4 rounded-[28px] border border-slate-200/80 bg-white/90 p-4 shadow-[0_18px_40px_rgba(15,23,42,0.08)] backdrop-blur; }

input, select {
  @apply rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm shadow-sm transition duration-200 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400;
}

table { @apply w-full border-collapse text-left; }
th { @apply border-b border-slate-200 bg-slate-50/80 px-6 py-4 text-xs font-semibold uppercase tracking-[0.14em] text-slate-500; }
td { @apply border-b border-slate-100 px-6 py-4 text-sm; }

tbody tr { @apply transition duration-200 hover:bg-slate-50/80; }
tr.selected { @apply bg-green-50/80; }
tr.rejected { @apply bg-red-50/80; }

.btn { @apply cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-2 text-xs font-semibold text-slate-700 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md; }
.btn-select { @apply border-green-200 bg-green-600 text-white hover:bg-green-700; }
.btn-reject { @apply border-red-200 bg-red-600 text-white hover:bg-red-700; }

.status-badge { @apply rounded-full border px-3 py-1 text-xs font-semibold; }
.Pending { @apply border-blue-200 bg-blue-100 text-blue-700; }
.Selected { @apply border-green-200 bg-green-100 text-green-700; }
.Rejected { @apply border-red-200 bg-red-100 text-red-700; }
</style>
</head>

<body data-client-key="">

<div class="max-w-6xl mx-auto">
  <div class="mb-6 flex flex-col gap-4 overflow-hidden rounded-[30px] border border-blue-100 bg-[linear-gradient(135deg,rgba(59,130,246,0.12),rgba(255,255,255,0.94)_42%),white] px-6 py-6 shadow-[0_22px_50px_rgba(15,23,42,0.10)] sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-4 min-w-0">
      <img id="visibleCompanyLogo" src="assets/eassyonboard-logo.png" alt="Client logo" class="h-16 w-16 rounded-2xl border border-blue-100 bg-white p-2.5 object-contain shadow-[0_16px_30px_rgba(59,130,246,0.14)]">
      <div class="min-w-0">
        <h1 id="visibleCompanyName" class="text-3xl font-bold tracking-[-0.04em] text-slate-900">Arena Dashboard</h1>
        <p class="mt-1 text-sm text-slate-500">Client review and submission tracking</p>
      </div>
    </div>
    <div class="inline-flex items-center gap-2 rounded-full border border-blue-100 bg-white/80 px-4 py-2 text-xs font-semibold text-blue-700 shadow-sm">
      <i class="ri-flashlight-line"></i>
      Active Review Queue
    </div>
    <div class="hidden">
      <img id="companyLogo" src="" alt="">
      <span id="companyName">Arena Dashboard</span>
    </div>
  </div>

  <div class="controls">
  <input type="text" id="search" placeholder="Search..." onkeyup="applyFilters()" class="min-w-[220px] flex-1">
  
  <select id="statusFilter" onchange="applyFilters()">
    <option value="All">All</option>
    <option value="Pending">Pending</option>
    <option value="Selected">Selected</option>
    <option value="Rejected">Rejected</option>
  </select>

  <select id="roleFilter" onchange="applyFilters()">
    <option value="All">All Roles</option>
  </select>

  <button 
    class="btn" 
    style="background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color:white; border-color:#2563eb;"
    onclick="refreshData()">
    Refresh 🔄
  </button>
</div>

  <div class="overflow-hidden rounded-[28px] border border-slate-200/80 bg-white/90 shadow-[0_18px_40px_rgba(15,23,42,0.08)] backdrop-blur">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Experience</th>
          <th>Resume</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="rows">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
    <div id="pageInfo" style="font-size:13px; color:#64748b;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="prevBtn" onclick="prevPage()">⬅ Prev</button>
      <button class="btn" id="nextBtn" onclick="nextPage()">Next ➡</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="frontend/client-dashboard-supabase.js"></script>

</body>
</html>
